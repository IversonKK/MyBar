<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bar Management POS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="/dashboard.css?v=4">
</head>
<body>
    <div id="toast"></div>
    
    <!-- Header -->
    <header class="pos-header">
        <div class="header-left">
            <h1>📝 吧台接單系統</h1>
        </div>
        <div class="header-right">
            <button onclick="showTodayStats()" class="pos-btn">📊 統計</button>
            <button onclick="toggleCompactCardView()" class="pos-btn" id="btn-toggle-compact">📱 緊湊卡片</button>
            <button onclick="toggleSidebar()" class="pos-btn" id="btn-toggle-inv">📦 庫存</button>

            <!-- ⚙️ 吧台工具箱 Dropdown Container -->
            <div class="toolbox-dropdown-container" style="position: relative;">
                <button onclick="toggleToolboxMenu(event)" class="pos-btn" id="btn-toggle-toolbox" style="background: #2c3e50; border-color: #34495e;">
                    ⚙️ 工具 ▾
                </button>
                <div id="pos-toolbox-menu" class="pos-toolbox-menu" onclick="event.stopPropagation()">
                    <div class="toolbox-menu-header">⚙️ 吧台管理工具</div>
                    
                    <div class="toolbox-menu-item">
                        <span class="toolbox-label">⏰ 超時警告線</span>
                        <select id="overtime-threshold" onchange="checkOvertime()" class="toolbox-select">
                            <option value="10">10 分</option>
                            <option value="15" selected>15 分</option>
                            <option value="20">20 分</option>
                            <option value="30">30 分</option>
                            <option value="45">45 分</option>
                            <option value="60">60 分</option>
                        </select>
                    </div>

                    <div class="toolbox-divider"></div>

                    <button onclick="openCampaignModal(); closeToolboxMenu();" class="toolbox-btn" id="btn-campaign-settings">
                        📢 活動設定
                    </button>
                    <button onclick="openAdjustLeaderboardModal(); closeToolboxMenu();" class="toolbox-btn">
                        🏆 調整榜單
                    </button>

                    <div class="toolbox-divider"></div>

                    <button onclick="clearFinished(); closeToolboxMenu();" class="toolbox-btn">
                        🧹 清理已完成訂單
                    </button>
                    <button onclick="resetAllHistory(); closeToolboxMenu();" class="toolbox-btn btn-danger-text">
                        🔥 清空所有歷史紀錄
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="pos-workspace">

        <!-- 🔥 同酒款批量製作匯總欄 -->
        <div id="batch-summary-bar" class="batch-summary-bar" style="display: none;">
            <span class="batch-summary-title">🔥 待出餐匯總：</span>
            <div id="batch-pills-container" class="batch-pills-container"></div>
            <div id="batch-actions-container" class="batch-actions-container" style="display: none;"></div>
        </div>

        <!-- Main Board Wrapper -->
        <div class="kanban-board-wrapper">
            <!-- Kanban Board -->
            <div class="kanban-container" id="kanban-container">
                <!-- 待接單 Column -->
                <div class="kanban-col" id="col-pending">
                    <div class="kanban-col-header">
                        <span>⌛ 待處理 <span id="pending-count" class="pending-badge" style="display:none;">0</span></span>
                        <span class="kanban-col-count" id="count-pending">0</span>
                    </div>
                    <div class="kanban-list" id="list-pending" data-status="pending"></div>
                </div>

                <!-- 製作中 Column -->
                <div class="kanban-col" id="col-making">
                    <div class="kanban-col-header">
                        <span>👨‍🍳 製作中</span>
                        <span class="kanban-col-count" id="count-making">0</span>
                    </div>
                    <div class="kanban-list" id="list-making" data-status="making"></div>
                </div>

                <!-- 已完成 Column -->
                <div class="kanban-col" id="col-completed">
                    <div class="kanban-col-header">
                        <span>✅ 已出餐</span>
                        <span class="kanban-col-count" id="count-completed">0</span>
                    </div>
                    <div class="kanban-list" id="list-completed" data-status="completed"></div>
                </div>
            </div>

            <!-- Inventory Sidebar -->
            <div class="inventory-sidebar hidden" id="inventory-sidebar">
                <div class="inv-header">
                    <span>📦 庫存與配方管理</span>
                    <div class="inv-header-actions">
                        <button onclick="openEditRecipeModal()" title="新增配方">➕ 新增</button>
                        <button onclick="reloadRecipes()" title="重新載入配方庫" style="color: #2ecc71;">🔄 重載</button>
                        <button onclick="toggleSidebar()" style="background: transparent; color: #aaa; font-size: 1.2em; padding: 0;">✖</button>
                    </div>
                </div>

                <div class="inv-content">
                    <div class="inv-tools-row" style="margin-bottom: 10px;">
                        <input type="text" id="inventory-search-input" class="inv-search" placeholder="🔍 搜尋酒名、材料、標籤...">
                    </div>

                    <div class="ingredient-stock-section" style="margin-bottom: 12px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; border: 1px solid rgba(243,156,18,0.2);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <span style="font-size: 0.88em; color: #f39c12; font-weight: bold;">📦 原料開瓶與缺料管理 (點擊切換)</span>
                            <button onclick="toggleIngredientStockCollapse()" id="toggle-stock-collapse-btn" style="background: transparent; border: none; color: #aaa; font-size: 0.8em; cursor: pointer;">展開/收合</button>
                        </div>
                        <div id="ingredient-stock-container" class="ingredient-stock-container"></div>
                    </div>

                    <div style="height: 1px; background: #333; margin: 5px 0;"></div>

                    <div class="inv-list" id="inv-list"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- 編輯配方 Modal -->
    <div id="edit-recipe-modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="edit-modal-title">✏️ 編輯酒單配方</h2>
                <button class="modal-close" onclick="closeEditRecipeModal()">✖</button>
            </div>

            <div class="edit-form-group">
                <label>酒名 (Drink Name) *作為檔案與圖片識別</label>
                <input type="text" id="edit-recipe-name" placeholder="輸入酒名 (例如：Mojito)">
            </div>

            <div style="display:flex; gap: 10px;">
                <div class="edit-form-group" style="flex:1;">
                    <label>酒精濃度 (%)</label>
                    <input type="number" id="edit-recipe-abv" placeholder="例如：15">
                </div>
                <div class="edit-form-group" style="flex:1;">
                    <label>酒感 (1-5)</label>
                    <input type="number" id="edit-recipe-strong" min="1" max="5" placeholder="例如：3">
                </div>
                <div class="edit-form-group" style="flex:1;">
                    <label>酸甜度 (1-5)</label>
                    <input type="number" id="edit-recipe-sour" min="1" max="5" placeholder="例如：3">
                </div>
            </div>

            <div class="edit-form-group">
                <label>標籤 (Tags) - 以逗號分隔</label>
                <input type="text" id="edit-recipe-tags" placeholder="例如：琴酒, 有氣泡, 清爽">
            </div>

            <div class="edit-form-group" id="image-section">
                <label>📸 圖片設定</label>

                <!-- Tab 切換 -->
                <div style="display: flex; gap: 0; margin-bottom: 10px; border-radius: 8px; overflow: hidden; border: 1px solid #444;">
                    <button id="img-tab-upload" class="img-tab-btn active" onclick="switchImgTab('upload')" type="button"
                        style="flex:1; padding: 8px; background: #333; color: #f39c12; font-size: 0.9em; border: none; cursor: pointer; transition: background 0.2s; border-right: 1px solid #444;">
                        ⬆️ 上傳新圖
                    </button>
                    <button id="img-tab-existing" class="img-tab-btn" onclick="switchImgTab('existing')" type="button"
                        style="flex:1; padding: 8px; background: #222; color: #888; font-size: 0.9em; border: none; cursor: pointer; transition: background 0.2s;">
                        🗂️ 選擇既有圖
                    </button>
                </div>

                <!-- 上傳新圖 -->
                <div id="img-tab-panel-upload">
                    <input type="file" id="edit-recipe-image" accept="image/jpeg, image/png" onchange="previewCroppedImage(event)">
                    <div id="edit-image-preview-container" style="display: none; margin-top: 10px; text-align: center;">
                        <img id="edit-image-preview" src="" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px; border: 2px solid #f39c12;">
                    </div>
                </div>

                <!-- 選擇既有圖 -->
                <div id="img-tab-panel-existing" style="display: none;">
                    <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                        <input type="text" id="existing-img-search" placeholder="🔍 搜尋圖片名稱..." oninput="filterExistingImages()"
                            style="flex:1; padding: 7px 10px; border-radius: 6px; background: #1a1a1a; border: 1px solid #444; color: #fff; font-size: 0.85em; outline: none;">
                        <button onclick="clearExistingImageSelection()" type="button" class="pos-btn"
                            style="padding: 6px 10px; font-size: 0.8em;">✖ 清除</button>
                    </div>
                    <!-- 已選圖片預覽 -->
                    <div id="existing-img-selected-preview" style="display: none; margin-bottom: 8px; padding: 8px; background: rgba(243,156,18,0.1); border: 1px solid rgba(243,156,18,0.4); border-radius: 8px; display: none; align-items: center; gap: 10px;">
                        <img id="existing-img-selected-thumb" src="" style="width: 60px; height: 60px; object-fit: contain; border-radius: 6px; background: #111; border: 1px solid #555;">
                        <span id="existing-img-selected-name" style="color: #f39c12; font-size: 0.9em; font-weight: bold;"></span>
                    </div>
                    <!-- 圖片格 -->
                    <div id="existing-img-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 6px; max-height: 200px; overflow-y: auto; padding: 4px; background: #111; border-radius: 8px; border: 1px solid #333;">
                        <div style="grid-column: 1/-1; text-align: center; color: #555; padding: 20px; font-size: 0.85em;">載入中...</div>
                    </div>
                </div>

                <!-- Hidden inputs -->
                <input type="hidden" id="selected-edit-preset-image" value="">
                <input type="hidden" id="selected-edit-existing-image" value="">
            </div>

            <div class="edit-form-group">
                <label>描述與配方</label>
                <div style="display: flex; gap: 5px; margin-bottom: 8px;">
                    <select id="quick-ingredient-select" style="flex: 1;"><option value="">-- 快速插入現有材料 --</option></select>
                    <input type="text" id="quick-ingredient-amount" placeholder="份量" style="width: 80px;" onkeypress="if(event.key === 'Enter'){ event.preventDefault(); insertIngredientToDesc(); }">
                    <button class="pos-btn btn-primary" onclick="insertIngredientToDesc()">➕</button>
                </div>
                <textarea id="edit-recipe-description" placeholder="材料：琴酒 45ml, 檸檬汁 15ml, 糖漿 10ml\n技法：Shake\n杯型：馬丁尼杯\n裝飾：檸檬片"></textarea>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px;">
                <button class="pos-btn" onclick="closeEditRecipeModal()">取消</button>
                <button class="pos-btn btn-primary" onclick="saveRecipe()">💾 儲存配方</button>
            </div>
        </div>
    </div>

    <!-- 統計 Modal -->
    <div id="stats-modal-overlay" class="modal-overlay">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <h2 style="color: #9b59b6;">📊 今日出杯統計</h2>
                <button class="modal-close" onclick="closeStatsModal()">✖</button>
            </div>
            <div id="stats-modal-body" style="min-height: 150px;"></div>
            <button class="pos-btn btn-primary" style="width: 100%; margin-top: 20px; justify-content: center; background: #27ae60; border-color: #27ae60; color: #fff;" onclick="exportTodayStats()">📥 複製報表至剪貼簿</button>
        </div>
    </div>

    <!-- 歷史點餐 Modal (For specific guest) -->
    <div id="guest-history-modal-overlay" class="modal-overlay">
        <div class="modal-content" style="max-width: 600px; display: flex; flex-direction: column; height: 80vh;">
            <div class="modal-header">
                <h2 id="guest-history-title" style="display: flex; align-items: center; color: #fff;"></h2>
                <button class="modal-close" onclick="closeGuestHistoryModal()">✖</button>
            </div>
            <div id="guest-history-list" style="flex: 1; overflow-y: auto; padding-right: 5px;"></div>
        </div>
    </div>

    <!-- 調整歷史榜單 Modal -->
    <div id="adjust-leaderboard-modal-overlay" class="modal-overlay">
        <div class="modal-content" style="max-width: 550px; display: flex; flex-direction: column; height: 80vh;">
            <div class="modal-header">
                <h2 style="color: #8e44ad; display: flex; align-items: center; gap: 8px;">🏆 調整歷史榜單</h2>
                <button class="modal-close" onclick="closeAdjustLeaderboardModal()">✖</button>
            </div>
            
            <!-- 新增紀錄區域 -->
            <div style="background: rgba(255,255,255,0.03); border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                <h3 style="color: #f39c12; margin-top: 0; margin-bottom: 10px; font-size: 1.05em;">➕ 手動新增已完成紀錄</h3>
                
                <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; margin-bottom: 10px;">
                    <!-- 客人選擇 (複選) -->
                    <div style="flex: 1.2; min-width: 200px; display: flex; flex-direction: column;">
                        <label style="display: block; font-size: 0.85em; color: #aaa; margin-bottom: 4px; font-weight: bold;">選擇客人 (可多選，或輸入新名字)</label>
                        <div style="display: flex; gap: 6px; margin-bottom: 6px;">
                            <input type="text" id="manual-guest-name" placeholder="輸入新客人..." onkeypress="if(event.key === 'Enter'){ event.preventDefault(); addTypedGuestToSelection(); }" style="flex: 1; padding: 6px 10px; border-radius: 6px; background: #222; border: 1px solid #444; color: #fff; font-size: 0.9em; outline: none;">
                            <button onclick="addTypedGuestToSelection()" class="pos-btn btn-primary" style="padding: 6px 10px; font-size: 0.85em; border-radius: 6px;" type="button">➕ 新增</button>
                        </div>
                        <!-- 快速選擇客人的 Checkbox 區域 -->
                        <div id="guest-checkboxes-container" style="flex: 1; max-height: 100px; overflow-y: auto; background: #111; border: 1px solid #333; padding: 8px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px;">
                            <!-- JS 動態產生客人的 Checkbox -->
                        </div>
                    </div>
                    
                    <!-- 選擇飲品 -->
                    <div style="flex: 1; min-width: 150px; display: flex; flex-direction: column; justify-content: space-between;">
                        <div>
                            <label style="display: block; font-size: 0.85em; color: #aaa; margin-bottom: 4px; font-weight: bold;">選擇飲品</label>
                            <select id="manual-drink-select" onchange="handleManualDrinkSelectChange()" style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; background: #222; border: 1px solid #444; color: #fff;"></select>
                        </div>
                        <div style="margin-top: 10px;">
                            <label style="display: block; font-size: 0.85em; color: #aaa; margin-bottom: 4px; font-weight: bold;">選擇日期</label>
                            <input type="date" id="manual-order-date" style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; background: #222; border: 1px solid #444; color: #fff; outline: none; font-size: 0.9em;">
                        </div>
                        <div style="margin-top: 10px; display: flex; gap: 8px;">
                            <button onclick="selectAllGuests()" class="pos-btn" style="flex: 1; padding: 6px; font-size: 0.8em; border-radius: 4px; background: #222; border-color: #444;">全選</button>
                            <button onclick="clearAllGuests()" class="pos-btn" style="flex: 1; padding: 6px; font-size: 0.8em; border-radius: 4px; background: #222; border-color: #444;">清空</button>
                        </div>
                    </div>
                </div>

                <!-- 自訂飲品名稱 (隱藏) -->
                <div id="manual-custom-drink-wrap" style="display: none; margin-bottom: 10px;">
                    <label style="display: block; font-size: 0.8em; color: #aaa; margin-bottom: 4px;">自訂飲品名稱</label>
                    <input type="text" id="manual-custom-drink-name" placeholder="請輸入自訂酒名 (例如：佛森特調)" style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; background: #222; border: 1px solid #444; color: #fff; margin-bottom: 10px;">
                    
                    <label style="display: block; font-size: 0.8em; color: #aaa; margin-bottom: 4px;">選擇配圖 (可選)</label>
                    <div id="manual-custom-image-selector" style="display: flex; gap: 8px; overflow-x: auto; padding: 5px 0;">
                        <div class="preset-img-option" data-preset="preset1.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset1.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset2.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset2.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset3.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset3.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset4.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset4.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset5.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset5.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset6.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset6.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset7.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset7.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset8.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset8.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset9.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset9.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset10.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset10.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset11.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset11.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset12.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset12.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset13.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset13.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset14.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset14.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset15.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset15.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset16.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset16.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset17.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset17.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset18.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset18.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset19.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset19.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <div class="preset-img-option" data-preset="preset20.png" onclick="selectPresetImage(this)" style="position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;"><img src="/images/presets/preset20.png" style="width: 100%; height: 100%; object-fit: cover;"></div>
                    </div>
                    <input type="hidden" id="selected-preset-image" value="">
                </div>
                
                <button onclick="submitManualCompletedOrder()" class="pos-btn btn-primary" style="width: 100%; justify-content: center; background: #8e44ad; border-color: #8e44ad; color: #fff;">送出並設為已完成</button>
            </div>
            
            <!-- 歷史紀錄列表 -->
            <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                <h3 style="color: #f39c12; margin-top: 0; margin-bottom: 8px; font-size: 1.05em;">📜 已完成歷史紀錄</h3>
                
                <!-- 篩選列：日期選擇 + 搜尋框 -->
                <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                    <select id="adjust-date-filter" onchange="renderAdjustHistoryList()" style="width: 130px; box-sizing: border-box; padding: 8px; border-radius: 6px; background: #222; border: 1px solid #444; color: #fff; font-size: 0.9em; outline: none;"></select>
                    <input type="text" id="adjust-search-input" oninput="renderAdjustHistoryList()" placeholder="🔍 搜尋客人或酒名..." style="flex: 1; box-sizing: border-box; padding: 8px; border-radius: 6px; background: #222; border: 1px solid #444; color: #fff; font-size: 0.95em;">
                </div>
                
                <div id="adjust-history-list" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px;"></div>
            </div>
        </div>
    </div>


    <!-- 活動設定 Modal -->
    <div id="campaign-modal-overlay" class="modal-overlay">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <h2>📢 主題活動與特惠設定</h2>
                <button class="modal-close" onclick="closeCampaignModal()">✖</button>
            </div>
            <div class="edit-form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 10px; margin-bottom: 20px;">
                <label style="margin: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 1.05em; color: #fff;">
                    <input type="checkbox" id="campaign-active" style="width: 20px; height: 20px; cursor: pointer;">
                    啟用活動 Banner
                </label>
            </div>
            <div class="edit-form-group">
                <label for="campaign-tag-input">活動標籤 (如: Happy Hour, 特惠)</label>
                <input type="text" id="campaign-tag-input" placeholder="例如：活動" maxlength="10">
            </div>
            <div class="edit-form-group">
                <label for="campaign-text-input">活動內容說明 (最多 100 字)</label>
                <textarea id="campaign-text-input" placeholder="例如：今日 Happy Hour：全場調酒 9 折！" maxlength="100" style="height: 60px; resize: none;"></textarea>
            </div>
            <div class="edit-form-group">
                <label for="campaign-style-select">Banner 樣式主題</label>
                <select id="campaign-style-select">
                    <option value="gold">✨ 奢華金黃 (金底黑字)</option>
                    <option value="rose">🌹 浪漫玫紅 (紅底白字)</option>
                    <option value="cyan">💎 時尚極光 (藍青漸層)</option>
                    <option value="amber">🔥 暖心琥珀 (橘紅漸層)</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="pos-btn btn-primary" onclick="submitCampaignSettings()" style="flex: 1; padding: 10px;">儲存並發佈</button>
                <button class="pos-btn" onclick="closeCampaignModal()" style="flex: 1; padding: 10px; background: transparent; border-color: #555;">取消</button>
            </div>
        </div>
    </div>

    <!-- 圖片預覽 Modal -->
    <div id="image-modal-overlay" class="modal-overlay" style="z-index: 11000; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);">
        <div id="image-modal-close-btn" class="modal-close" style="position: absolute; top: 20px; right: 20px; font-size: 2em; background: rgba(0,0,0,0.5); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #555;">✖</div>
        <img id="modal-image" src="" style="max-width: 90%; max-height: 90%; object-fit: contain; cursor: zoom-out; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
    </div>

    <script src="/dashboard.js?v=5"></script>
</body>
</html>
