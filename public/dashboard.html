<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bar Management POS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="/dashboard.css?v=2">
</head>
<body>
    <div id="toast"></div>
    
    <!-- Header -->
    <header class="pos-header">
        <div class="header-left">
            <h1>📝 吧台接單系統</h1>
        </div>
        <div class="header-right">
            <div class="settings-wrap">
                <label>⏰ 警告線</label>
                <select id="overtime-threshold" onchange="checkOvertime()">
                    <option value="10">10 分</option>
                    <option value="15" selected>15 分</option>
                    <option value="20">20 分</option>
                    <option value="30">30 分</option>
                    <option value="45">45 分</option>
                    <option value="60">60 分</option>
                </select>
            </div>
            <button onclick="showTodayStats()" class="pos-btn">📊 統計</button>
            <button onclick="clearFinished()" class="pos-btn">🧹 清理</button>
            <button onclick="resetAllHistory()" class="pos-btn btn-danger">🔥 清空</button>
            <button onclick="toggleSidebar()" class="pos-btn btn-primary" id="btn-toggle-inv">📦 庫存</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="pos-workspace">

        <!-- Kanban Board -->
        <div class="kanban-container" id="kanban-container">
            <!-- 待接單 Column -->
            <div class="kanban-col" id="col-pending">
                <div class="kanban-col-header">
                    <span>⌛ 待處理 <span id="pending-count" class="pending-badge" style="display:none;">0</span></span>
                    <span class="kanban-col-count" id="count-pending">0</span>
                </div>
                <div class="kanban-list" id="list-pending" data-status="pending"></div>
            </div>

            <!-- 製作中 Column -->
            <div class="kanban-col" id="col-making">
                <div class="kanban-col-header">
                    <span>👨‍🍳 製作中</span>
                    <span class="kanban-col-count" id="count-making">0</span>
                </div>
                <div class="kanban-list" id="list-making" data-status="making"></div>
            </div>

            <!-- 已完成 Column -->
            <div class="kanban-col" id="col-completed">
                <div class="kanban-col-header">
                    <span>✅ 已出餐</span>
                    <span class="kanban-col-count" id="count-completed">0</span>
                </div>
                <div class="kanban-list" id="list-completed" data-status="completed"></div>
            </div>
        </div>

        <!-- Inventory Sidebar -->
        <div class="inventory-sidebar hidden" id="inventory-sidebar">
            <div class="inv-header">
                <span>📦 庫存與配方管理</span>
                <div class="inv-header-actions">
                    <button onclick="openEditRecipeModal()" title="新增配方">➕ 新增</button>
                    <button onclick="reloadRecipes()" title="重新載入配方庫" style="color: #2ecc71;">🔄 重載</button>
                    <button onclick="toggleSidebar()" style="background: transparent; color: #aaa; font-size: 1.2em; padding: 0;">✖</button>
                </div>
            </div>
            
            <div class="inv-content">
                <div class="inv-tools-row" style="margin-bottom: 10px;">
                    <input type="text" id="inventory-search-input" class="inv-search" placeholder="🔍 搜尋酒名、材料、標籤...">
                </div>

                <div>
                    <div style="font-size: 0.85em; color: #888; font-weight: bold; margin-bottom: 8px;">⚡ 常缺貨快捷鍵</div>
                    <div class="quick-toggles" id="quick-toggle-buttons"></div>
                </div>

                <div style="height: 1px; background: #333; margin: 5px 0;"></div>

                <div class="inv-list" id="inv-list"></div>
            </div>
        </div>

    </div>

    <!-- 編輯配方 Modal -->
    <div id="edit-recipe-modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="edit-modal-title">✏️ 編輯酒單配方</h2>
                <button class="modal-close" onclick="closeEditRecipeModal()">✖</button>
            </div>

            <div class="edit-form-group">
                <label>酒名 (Drink Name) *作為檔案與圖片識別</label>
                <input type="text" id="edit-recipe-name" placeholder="輸入酒名 (例如：Mojito)">
            </div>

            <div style="display:flex; gap: 10px;">
                <div class="edit-form-group" style="flex:1;">
                    <label>酒精濃度 (%)</label>
                    <input type="number" id="edit-recipe-abv" placeholder="例如：15">
                </div>
                <div class="edit-form-group" style="flex:1;">
                    <label>酒感 (1-5)</label>
                    <input type="number" id="edit-recipe-strong" min="1" max="5" placeholder="例如：3">
                </div>
                <div class="edit-form-group" style="flex:1;">
                    <label>酸甜度 (1-5)</label>
                    <input type="number" id="edit-recipe-sour" min="1" max="5" placeholder="例如：3">
                </div>
            </div>

            <div class="edit-form-group">
                <label>標籤 (Tags) - 以逗號分隔</label>
                <input type="text" id="edit-recipe-tags" placeholder="例如：琴酒, 有氣泡, 清爽">
            </div>

            <div class="edit-form-group">
                <label>圖片上傳 (自動置中裁切為正方形)</label>
                <input type="file" id="edit-recipe-image" accept="image/jpeg, image/png" onchange="previewCroppedImage(event)">
                <div id="edit-image-preview-container" style="display: none; margin-top: 10px; text-align: center;">
                    <img id="edit-image-preview" src="" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px; border: 2px solid #f39c12;">
                </div>
            </div>

            <div class="edit-form-group">
                <label>描述與配方</label>
                <div style="display: flex; gap: 5px; margin-bottom: 8px;">
                    <select id="quick-ingredient-select" style="flex: 1;"><option value="">-- 快速插入現有材料 --</option></select>
                    <input type="text" id="quick-ingredient-amount" placeholder="份量" style="width: 80px;" onkeypress="if(event.key === 'Enter'){ event.preventDefault(); insertIngredientToDesc(); }">
                    <button class="pos-btn btn-primary" onclick="insertIngredientToDesc()">➕</button>
                </div>
                <textarea id="edit-recipe-description" placeholder="材料：琴酒 45ml, 檸檬汁 15ml, 糖漿 10ml\n技法：Shake\n杯型：馬丁尼杯\n裝飾：檸檬片"></textarea>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px;">
                <button class="pos-btn" onclick="closeEditRecipeModal()">取消</button>
                <button class="pos-btn btn-primary" onclick="saveRecipe()">💾 儲存配方</button>
            </div>
        </div>
    </div>

    <!-- 統計 Modal -->
    <div id="stats-modal-overlay" class="modal-overlay">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <h2 style="color: #9b59b6;">📊 今日出杯統計</h2>
                <button class="modal-close" onclick="closeStatsModal()">✖</button>
            </div>
            <div id="stats-modal-body" style="min-height: 150px;"></div>
            <button class="pos-btn btn-primary" style="width: 100%; margin-top: 20px; justify-content: center; background: #27ae60; border-color: #27ae60; color: #fff;" onclick="exportTodayStats()">📥 複製報表至剪貼簿</button>
        </div>
    </div>

    <!-- 歷史點餐 Modal (For specific guest) -->
    <div id="guest-history-modal-overlay" class="modal-overlay">
        <div class="modal-content" style="max-width: 600px; display: flex; flex-direction: column; height: 80vh;">
            <div class="modal-header">
                <h2 id="guest-history-title" style="display: flex; align-items: center; color: #fff;"></h2>
                <button class="modal-close" onclick="closeGuestHistoryModal()">✖</button>
            </div>
            <div id="guest-history-list" style="flex: 1; overflow-y: auto; padding-right: 5px;"></div>
        </div>
    </div>

    <!-- 圖片預覽 Modal -->
    <div id="image-modal-overlay" class="modal-overlay" style="z-index: 11000; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);">
        <div id="image-modal-close-btn" class="modal-close" style="position: absolute; top: 20px; right: 20px; font-size: 2em; background: rgba(0,0,0,0.5); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #555;">✖</div>
        <img id="modal-image" src="" style="max-width: 90%; max-height: 90%; object-fit: contain; cursor: zoom-out; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
    </div>

    <script src="/dashboard.js?v=2"></script>
</body>
</html>
